<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#451624"><title>Store Admin | SHRI JI COLLECTION</title><link rel="stylesheet" href="style.css"><style>
:root{--adm:#451624;--gold:#c7a56b;--ink:#29211f;--muted:#786d68;--line:#e8dfd8;--paper:#fffdfa;--bg:#f6f3ee}.admin-body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:var(--adm);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:8px}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:1px;padding:6px 10px 25px}.brand small{display:block;font:10px Arial,sans-serif;letter-spacing:4px;color:#e3c58c;margin-top:5px}.navbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 13px;border:1px solid transparent;background:transparent;color:#f6e9e4;border-radius:8px;cursor:pointer;font-size:14px}.navbtn:hover,.navbtn.active{background:#ffffff16;border-color:#ffffff25;color:#fff}.navbottom{margin-top:auto;border-top:1px solid #ffffff25;padding-top:12px}.content{padding:clamp(18px,3vw,38px);min-width:0;max-width:1600px;width:100%;box-sizing:border-box;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:#99764a}.title{font:600 clamp(26px,3vw,36px) Georgia,serif;color:var(--adm);margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #35101c08}.card h2,.card h3{margin:0 0 14px;color:var(--adm);font-family:Georgia,serif}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}.metric span{display:block;font-size:12px;color:var(--muted)}.metric strong{display:block;font:600 28px Georgia,serif;color:var(--adm);margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5f514b}.input,select.input,textarea.input{width:100%;box-sizing:border-box;border:1px solid #ded4cb;background:#fff;border-radius:7px;padding:11px 12px;font:14px Arial,sans-serif;color:#302521;min-height:42px}.input:focus{outline:2px solid #c7a56b66;border-color:#b48a55}.input[type=file]{padding:9px}.full{grid-column:1/-1}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d8c8b8;border-radius:7px;background:#fff;color:var(--adm);padding:11px 15px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;min-height:40px;box-sizing:border-box}.btn.primary{background:var(--adm);color:#fff;border-color:var(--adm)}.btn.gold{background:#f6ead3;border-color:#e6d2ad}.btn.danger{color:#a12525;border-color:#e7caca}.btn:disabled{opacity:.55;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.notice{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.55;margin:12px 0;overflow-wrap:anywhere}.notice.error{background:#fff0ee;color:#8b2420;border:1px solid #f1cbc6}.notice.ok{background:#edf8f0;color:#22673a;border:1px solid #c9e7d1}.notice.info{background:#f5f0e8;color:#5f4b2c;border:1px solid #e7d8bc}.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar .input{max-width:360px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:720px;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee7e0;font-size:12px;vertical-align:middle}th{background:#f7f0e6;color:#624b3d;font-size:11px;letter-spacing:.3px}td img{width:48px;height:58px;object-fit:cover;border-radius:5px;background:#f4eee6}.tag{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;background:#eee;color:#4b403b}.tag.green{background:#e4f5e8;color:#22673a}.tag.red{background:#fff0ee;color:#9c2924}.productcell{display:flex;align-items:center;gap:10px;min-width:180px}.productcell b{display:block;max-width:210px;overflow-wrap:anywhere}.productcell small{color:var(--muted)}.order-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:17px;margin:12px 0}.orderhead{display:flex;align-items:start;justify-content:space-between;gap:10px}.orderhead strong{color:var(--adm);font-size:18px}.orderitems{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#faf7f2;border-radius:6px;padding:10px}.previews{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}.preview{width:88px;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.preview img{width:88px;height:88px;object-fit:cover;border:1px solid var(--line);border-radius:7px}.loginwrap{max-width:520px;margin:8vh auto}.loginwrap .brand{padding:0 0 20px;color:var(--adm)}.loginwrap .brand small{color:#99764a}.statusline{font-size:12px;color:var(--muted)}.mobilehead{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;display:block}.brand{font-size:20px;padding:7px 9px 13px}.brand small{font-size:8px}.navrow{display:flex;gap:6px;overflow:auto}.navbtn{white-space:nowrap;padding:10px;font-size:12px}.navbottom{display:flex;border:0;margin:8px 0 0;padding:0}.navbottom .navbtn{flex:1}.content{padding:17px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{align-items:flex-start}.title{font-size:27px}.card{padding:15px}}
</style></head>
<body class="admin-body"><div id="app"><div class="content"><div class="card">Loading admin panel…</div></div></div>
<script>
(() => {
'use strict';
const app=document.getElementById('app');
const state={user:null,products:[],orders:[],tab:'dashboard',busy:false};
const $=(id,root=document)=>root.querySelector('#'+id);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>{try{return new Date(v).toLocaleString('en-IN')}catch{return String(v||'')}};
async function api(url,options={}){
 const opts={credentials:'same-origin',...options,headers:{...(options.headers||{})}};
 if(opts.body && typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}
 const r=await fetch(url,opts);const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||'The server returned an unreadable response.'}}
 if(!r.ok){const e=new Error(data.error||`Request failed (${r.status})`);e.status=r.status;e.data=data;throw e}return data;
}
function message(text,type='error'){const el=$('globalMessage');if(!el)return;el.className='notice '+type;el.textContent=text;el.classList.remove('hidden');}
function clearMessage(){const el=$('globalMessage');if(el){el.classList.add('hidden');el.textContent=''}}
function loginView(note=''){
 app.innerHTML=`<main class="content"><section class="loginwrap"><div class="brand">SHRI JI <small>COLLECTION · STORE ADMIN</small></div><div class="card"><div class="eyebrow">SECURE WORKSPACE</div><h1 class="title">Admin sign in</h1><p class="muted">Sign in with your store administrator account. Customer accounts cannot manage products or orders.</p><div id="globalMessage" class="notice info ${note?'':'hidden'}">${esc(note)}</div><form id="loginForm"><label class="field">Email address<input class="input" id="loginEmail" type="email" autocomplete="username" required maxlength="254" placeholder="you@example.com"></label><label class="field" style="margin-top:12px">Password<input class="input" id="loginPassword" type="password" autocomplete="current-password" required maxlength="128" placeholder="Your password"></label><div class="actions"><button class="btn primary" id="loginBtn" type="submit">Sign in to admin</button><a class="btn" href="/account.html">Customer account</a><a class="btn" href="/">View store</a></div></form><p class="muted" style="margin-top:15px">First-time setup? Create a customer account first, then grant admin access using the one-time SQL instructions in the project’s <code>ADMIN_SETUP.md</code>. Do not share your password or service-role key.</p></div></section></main>`;
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearMessage();const btn=$('loginBtn');btn.disabled=true;btn.textContent='Signing in…';try{await api('/api/auth/login',{method:'POST',body:{email:$('loginEmail').value.trim(),password:$('loginPassword').value}});await checkAuth()}catch(err){let msg=err.message;if(err.status===401)msg='Login failed. Check your email/password. If you just signed up, confirm your email first.';message(msg,'error')}finally{btn.disabled=false;btn.textContent='Sign in to admin'}});
}
function shell(){app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">SHRI JI<small>COLLECTION · ADMIN</small></div><div class="navrow"><button class="navbtn" data-tab="dashboard">▦ Dashboard</button><button class="navbtn" data-tab="products">▣ Products</button><button class="navbtn" data-tab="orders">▤ Orders</button></div><div class="navbottom"><a class="navbtn" href="/" style="text-decoration:none">↗ View Store</a><button class="navbtn" id="logoutBtn">⇥ Sign out</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">SHOP MANAGEMENT</div><h1 class="title" id="pageTitle">Dashboard</h1><div class="statusline" id="userLabel">Signed in</div></div><button class="btn" id="refreshBtn">↻ Refresh data</button></div><div id="globalMessage" class="notice hidden"></div><section id="view"></section></main></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>loadTab(b.dataset.tab)));
 $('logoutBtn').addEventListener('click',logout);$('refreshBtn').addEventListener('click',()=>loadTab(state.tab));$('userLabel').textContent=state.user?.email||'Administrator';
}
async function checkAuth(){
 try{const d=await api('/api/auth/me');state.user=d.user;if(!state.user){loginView();return}shell();try{await api('/api/admin/products');await loadTab('dashboard')}catch(err){if(err.status===403){adminAccessHelp();return}message(err.message,'error');$('view').innerHTML=`<div class="card"><h2>Could not load admin data</h2><p class="muted">${esc(err.message)}</p><button class="btn primary" id="retryAccess">Try again</button></div>`;$('retryAccess').onclick=checkAuth}}
 catch(e){loginView('Cannot contact the authentication API. Check the latest deployment and environment variables, then refresh. '+e.message)}
}
function adminAccessHelp(){
 const email=state.user?.email||'';
 $('pageTitle').textContent='Admin access setup';
 $('view').innerHTML=`<div class="card"><div class="eyebrow">SIGNED IN, BUT NOT AN ADMIN</div><h2>Grant store-admin access</h2><p class="muted">Your login worked. The server rejected admin access because this account is not listed in <code>public.admin_users</code>. This is expected security behaviour; the browser cannot promote itself.</p><div class="notice info">Signed-in account: <b>${esc(email)}</b><br>User ID: <code>${esc(state.user?.id||'not returned')}</code></div><h3>One-time Supabase setup</h3><p class="muted">Open Supabase → SQL Editor. In the project ZIP, open <code>ADMIN_SETUP.md</code> and use the SQL there, replacing the example email with this account’s email. Run it once, then click Refresh data here.</p><div class="actions"><button class="btn primary" id="retryAdmin">I added admin access — refresh</button><a class="btn" href="/account.html">Open customer account</a><button class="btn" id="signOutFromHelp">Sign out</button></div></div>`;
 $('retryAdmin').onclick=checkAuth;$('signOutFromHelp').onclick=logout;
}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}state.user=null;loginView('You have been signed out.')}
async function loadTab(tab){state.tab=tab;clearMessage();$('pageTitle').textContent=tab==='dashboard'?'Dashboard':tab==='products'?'Products':'Orders';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('view').innerHTML='<div class="card">Loading…</div>';try{if(tab==='dashboard'){const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders')]);state.products=p.products||[];state.orders=o.orders||[];dashboardView()}else if(tab==='products'){const p=await api('/api/admin/products');state.products=p.products||[];productsView()}else{const o=await api('/api/admin/orders');state.orders=o.orders||[];ordersView()}}catch(err){if(err.status===403){adminAccessHelp();return}message(err.message,'error');$('view').innerHTML=`<div class="card"><h2>Could not load ${esc(tab)}</h2><p class="muted">${esc(err.message)}</p><button class="btn primary" id="tryAgain">Try again</button></div>`;$('tryAgain').onclick=()=>loadTab(tab)}}
function dashboardView(){const ps=state.products,os=state.orders;$('view').innerHTML=`<div class="metrics"><div class="metric"><span>Total products</span><strong>${ps.length}</strong></div><div class="metric"><span>Visible in store</span><strong>${ps.filter(p=>p.active).length}</strong></div><div class="metric"><span>Low stock (≤ 5)</span><strong>${ps.filter(p=>Number(p.stock)<=5).length}</strong></div><div class="metric"><span>Total orders</span><strong>${os.length}</strong></div></div><div class="card"><h2>Quick actions</h2><p class="muted">Add real product photos, set prices and stock, and keep customer orders updated here.</p><div class="actions"><button class="btn primary" id="addFirst">＋ Add product</button><button class="btn" id="viewOrders">View orders (${os.length})</button><a class="btn" href="/">Open storefront ↗</a></div></div><div class="card"><h2>Recent orders</h2>${os.slice(0,5).map(orderCardSummary).join('')||'<p class="muted">No orders have been placed yet.</p>'}</div>`;$('addFirst').onclick=()=>{state.tab='products';productsView(true)};$('viewOrders').onclick=()=>loadTab('orders')}
function productRows(){return state.products.map(p=>{const img=(p.image_urls||[])[0];return `<tr><td><div class="productcell">${img?`<img src="${esc(img)}" alt="">`:'<div style="width:48px;height:58px;background:#f3eee8;border-radius:5px;display:grid;place-items:center">—</div>'}<div><b>${esc(p.name)}</b><small>ID: ${esc(p.id)}</small></div></div></td><td>${esc(p.category)}</td><td>${money(p.sale_price&&Number(p.sale_price)<Number(p.price)?p.sale_price:p.price)}${p.sale_price&&Number(p.sale_price)<Number(p.price)?`<br><small><del>${money(p.price)}</del></small>`:''}</td><td>${Number(p.stock)||0}</td><td><span class="tag ${p.active?'green':'red'}">${p.active?'Visible':'Hidden'}</span></td><td><div class="actions" style="margin:0"><button class="btn" data-edit="${esc(p.id)}">Edit</button><button class="btn danger" data-delete="${esc(p.id)}">Delete</button></div></td></tr>`}).join('')||'<tr><td colspan="6">No products yet. Use “Add product” to create the first listing.</td></tr>'}
function productsView(showForm=false){$('view').innerHTML=`<div class="card" id="productEditor"><div class="toolbar"><div><h2 id="formTitle">Add a product</h2><p class="muted">Use clear real product photos. Fields marked * are required.</p></div><button class="btn" id="clearForm">Clear form</button></div><div id="formMessage" class="notice hidden"></div><form id="productForm"><input type="hidden" id="p_id"><div class="grid"><label class="field">Product name *<input class="input" id="p_name" maxlength="180" required placeholder="e.g. Printed Cotton Kurti"></label><label class="field">Category *<select class="input" id="p_category" required><option value="">Choose category</option>${['Kurti','Suit','Dupatta','Dress Material','Fall/Astar','Maxi/Gown','Thakur Ji Poshak','Mala','Mukut','Bansuri','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Regular price (₹) *<input class="input" id="p_price" type="number" min="0.01" step="0.01" required placeholder="799"></label><label class="field">Sale price (optional)<input class="input" id="p_sale" type="number" min="0.01" step="0.01" placeholder="699"></label><label class="field">Stock quantity *<input class="input" id="p_stock" type="number" min="0" step="1" value="0" required></label><label class="field">Material<input class="input" id="p_material" maxlength="120" placeholder="Cotton, silk, etc."></label><label class="field">Sizes (comma separated)<input class="input" id="p_sizes" placeholder="S, M, L, XL"></label><label class="field">Visibility<select class="input" id="p_active"><option value="true">Visible in store</option><option value="false">Hidden from store</option></select></label><label class="field full">Product photos (JPG, PNG or WebP; up to 4 MB each)<input class="input" id="p_files" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="filePreview" class="previews"></div></label><label class="field full">Existing image URLs (optional, comma separated)<input class="input" id="p_images" placeholder="Uploaded image URLs will appear here"><small class="muted">When editing, existing images are kept unless you remove their URLs here.</small></label><label class="field full">Description<textarea class="input" id="p_description" rows="4" maxlength="5000" placeholder="Fabric, fit, colour and product details"></textarea></label></div><div class="actions"><button class="btn primary" id="saveProduct" type="submit">Save product</button><button class="btn" type="button" id="cancelEdit">Cancel</button></div></form></div><div class="card"><div class="toolbar"><div><h2>Product catalogue</h2><p class="muted">Search, edit or remove listings.</p></div><input class="input" id="productSearch" placeholder="Search name/category…" aria-label="Search products"></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Visibility</th><th>Actions</th></tr></thead><tbody id="productRows">${productRows()}</tbody></table></div></div>`;
 $('productForm').addEventListener('submit',saveProduct);$('clearForm').onclick=resetForm;$('cancelEdit').onclick=resetForm;$('productSearch').oninput=filterProductRows;$('p_files').onchange=previewFiles;
 $('productRows').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));$('productRows').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));if(showForm)$('productEditor').scrollIntoView({behavior:'smooth',block:'start'});
}
function resetForm(){const form=$('productForm');if(!form)return;form.reset();$('p_id').value='';$('p_stock').value='0';$('formTitle').textContent='Add a product';$('saveProduct').textContent='Save product';$('filePreview').innerHTML='';$('p_images').value='';$('formMessage').classList.add('hidden')}
function editProduct(id){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;for(const [key,val] of Object.entries({p_id:p.id,p_name:p.name,p_category:p.category,p_price:p.price,p_sale:p.sale_price??'',p_stock:p.stock??0,p_material:p.material??'',p_sizes:(p.sizes||[]).join(', '),p_active:p.active?'true':'false',p_images:(p.image_urls||[]).join(', '),p_description:p.description??''})){const el=$(key);if(el)el.value=val} $('formTitle').textContent='Edit product';$('saveProduct').textContent='Update product';$('productEditor').scrollIntoView({behavior:'smooth',block:'start'})}
function previewFiles(){const box=$('filePreview');box.innerHTML='';for(const f of $('p_files').files){const u=URL.createObjectURL(f);const d=document.createElement('div');d.className='preview';const im=document.createElement('img');im.src=u;im.alt=f.name;const s=document.createElement('div');s.textContent=f.name;d.append(im,s);box.append(d)}}
async function uploadImages(){const files=Array.from($('p_files').files);if(files.some(f=>f.size>4*1024*1024))throw Error('Each image must be 4 MB or smaller.');if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)))throw Error('Use JPG, PNG or WebP images only.');const urls=[];for(const file of files){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(new Error('Could not read '+file.name));r.readAsDataURL(file)});const d=await api('/api/admin/upload-image',{method:'POST',body:{filename:file.name,contentType:file.type,data}});urls.push(d.url)}return urls}
async function saveProduct(e){e.preventDefault();const btn=$('saveProduct');btn.disabled=true;btn.textContent='Saving…';const fm=$('formMessage');fm.className='notice hidden';try{const uploaded=await uploadImages();const image_urls=[...new Set([...$('p_images').value.split(',').map(x=>x.trim()).filter(Boolean),...uploaded])];const p={name:$('p_name').value.trim(),category:$('p_category').value,price:Number($('p_price').value),sale_price:$('p_sale').value?Number($('p_sale').value):null,stock:Number($('p_stock').value),material:$('p_material').value.trim(),sizes:$('p_sizes').value.split(',').map(x=>x.trim()).filter(Boolean),image_urls,description:$('p_description').value.trim(),active:$('p_active').value==='true'};if(!p.name||!p.category)throw Error('Enter a product name and choose a category.');if(!Number.isFinite(p.price)||p.price<=0)throw Error('Enter a valid regular price.');if(p.sale_price!==null&&(!Number.isFinite(p.sale_price)||p.sale_price<=0||p.sale_price>=p.price))throw Error('Sale price must be lower than regular price.');if(!Number.isInteger(p.stock)||p.stock<0)throw Error('Stock must be a whole number zero or higher.');const id=$('p_id').value;let result=await api('/api/admin/products',{method:id?'PATCH':'POST',body:id?{...p,id}:p});fm.className='notice ok';fm.textContent=id?'Product updated successfully.':'Product added successfully.';await loadTab('products');message(id?'Product updated successfully.':'Product added successfully.','ok');}catch(err){fm.className='notice error';fm.textContent=err.message||'Could not save product.';fm.scrollIntoView({behavior:'smooth',block:'center'})}finally{btn.disabled=false;btn.textContent=$('p_id').value?'Update product':'Save product'}}
async function deleteProduct(id){const p=state.products.find(x=>String(x.id)===String(id));if(!confirm(`Delete “${p?.name||'this product'}” permanently?`))return;try{await api('/api/admin/products',{method:'DELETE',body:{id:Number(id)}});await loadTab('products');message('Product deleted.','ok')}catch(e){message(e.message,'error')}}
function filterProductRows(){const q=$('productSearch').value.toLowerCase();$('productRows').querySelectorAll('tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(q)})}
function orderCardSummary(o){return `<div class="order-card"><div class="orderhead"><div><b>${esc(o.order_number||o.id||'Order')}</b><div class="muted">${esc(o.customer_name)} · ${esc(o.phone)} · ${esc(fmtDate(o.created_at))}</div></div><strong>${money(o.total)}</strong></div><p class="muted">${esc(o.payment_method||'')} · Payment: ${esc(o.payment_status||'pending')} · Status: ${esc(o.order_status||o.status||'new')}</p></div>`}
function ordersView(){const statuses=['new','confirmed','packed','shipped','delivered','cancelled'];$('view').innerHTML=`<div class="metrics"><div class="metric"><span>Total orders</span><strong>${state.orders.length}</strong></div><div class="metric"><span>Pending</span><strong>${state.orders.filter(o=>(o.order_status||o.status)==='new').length}</strong></div><div class="metric"><span>Paid online</span><strong>${state.orders.filter(o=>o.payment_status==='paid').length}</strong></div><div class="metric"><span>Cash on delivery</span><strong>${state.orders.filter(o=>String(o.payment_method).toUpperCase()==='COD').length}</strong></div></div><div class="toolbar"><input class="input" id="orderSearch" placeholder="Search order, customer or phone"><select class="input" id="orderFilter" style="max-width:230px"><option value="all">All statuses</option>${statuses.map(s=>`<option value="${s}">${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><div id="ordersList">${state.orders.map(o=>orderCard(o,statuses)).join('')||'<div class="card"><h2>No orders yet</h2><p class="muted">Customer orders will appear here after checkout is configured and tested.</p></div>'}</div>`;$('orderSearch').oninput=filterOrderCards;$('orderFilter').onchange=filterOrderCards;$('ordersList').querySelectorAll('[data-update-order]').forEach(b=>b.onclick=()=>updateOrder(b.dataset.updateOrder))}
function orderCard(o,statuses){const no=String(o.order_number||o.id||'');const status=o.order_status||o.status||'new';return `<article class="order-card" data-search="${esc([no,o.customer_name,o.phone,o.email].join(' ').toLowerCase())}" data-status="${esc(status)}"><div class="orderhead"><div><b>${esc(no)}</b><div class="muted">${esc(o.customer_name)} · ${esc(o.phone)} · ${esc(fmtDate(o.created_at))}</div></div><strong>${money(o.total)}</strong></div><p class="muted">${esc(o.address||'')} ${esc([o.city,o.state,o.pincode].filter(Boolean).join(', '))}<br>Payment: <b>${esc(o.payment_status||'pending')}</b> · Method: ${esc(o.payment_method||'')}</p><details><summary>Order items</summary><pre class="orderitems">${esc(JSON.stringify(o.items||[],null,2))}</pre></details><div class="actions"><label class="field" style="min-width:200px;flex:1">Order status<select class="input" id="status-${esc(no)}">${statuses.map(s=>`<option value="${s}" ${s===status?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></label><button class="btn primary" data-update-order="${esc(no)}">Save status</button></div></article>`}
async function updateOrder(order_number){const select=$('status-'+CSS.escape(order_number));if(!select)return;try{await api('/api/admin/orders',{method:'PATCH',body:{order_number,order_status:select.value}});await loadTab('orders');message('Order status updated.','ok')}catch(e){message(e.message,'error')}}
function filterOrderCards(){const q=$('orderSearch').value.toLowerCase(),f=$('orderFilter').value;document.querySelectorAll('#ordersList .order-card').forEach(c=>{c.hidden=!(c.dataset.search.includes(q)&&(f==='all'||c.dataset.status===f))})}
checkAuth();
})();
</script></body></html>
