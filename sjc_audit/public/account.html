<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#541b2b"><title>My Account | SHRI JI COLLECTION</title><link rel="stylesheet" href="style.css"><style>.account-page{max-width:680px;margin:48px auto;padding:0 16px}.account-card{background:#fffdfa;border:1px solid #e8dfd8;border-radius:12px;padding:24px;margin:18px 0}.account-card h1,.account-card h2{font-family:Georgia,serif;color:#541b2b}.account-fields{display:grid;gap:12px}.account-message{padding:12px;border-radius:8px;font-size:13px;line-height:1.55;margin:12px 0;overflow-wrap:anywhere}.account-message.error{background:#fff0ee;color:#8b2420}.account-message.ok{background:#edf8f0;color:#22673a}.account-message.info{background:#f5f0e8;color:#5f4b2c}.account-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.orderline{border-bottom:1px solid #eaded4;padding:13px 0}.account-small{font-size:12px;color:#786d68;line-height:1.6}</style></head><body><header class="top"><div class="wrap nav"><a class="logo" href="/">SHRI JI<small>COLLECTION</small></a><a class="btn outline" href="/">Back to Shop</a></div></header><main class="account-page"><div id="app"><div class="account-card">Loading account…</div></div></main><script>
(()=>{'use strict';const A=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const o={credentials:'same-origin',...opts,headers:{...(opts.headers||{})}};if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(url,o);const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:'Server returned an unexpected response.'}}if(!r.ok){const e=new Error(d.error||`Request failed (${r.status})`);e.status=r.status;throw e}return d}
function renderAuth(note='',kind='info'){A.innerHTML=`<section class="account-card"><div class="eyebrow">MY ACCOUNT</div><h1 class="h2">Sign in or create an account</h1><p class="account-small">Use your customer account to see orders. Admin access is granted separately and cannot be created from this page.</p><div id="msg" class="account-message ${note?'':'hidden'} ${kind}">${esc(note)}</div><form id="authForm"><div class="account-fields"><label>Email address<input class="input" id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><label>Password<input class="input" id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="At least 8 characters"></label><label>Full name <span class="account-small">(needed only for sign up)</span><input class="input" id="fullName" maxlength="120" autocomplete="name" placeholder="Your name"></label></div><div class="account-actions"><button class="btn primary" id="loginBtn" type="button">Login</button><button class="btn outline" id="signupBtn" type="button">Create account</button><a class="btn outline" href="/">Continue shopping</a></div></form></section>`;
const login=async()=>{const btn=document.getElementById('loginBtn');btn.disabled=true;try{const d=await api('/api/auth/login',{method:'POST',body:{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}});await view()}catch(e){show(e.message,'error')}finally{btn.disabled=false}};
const signup=async()=>{const btn=document.getElementById('signupBtn');btn.disabled=true;try{const d=await api('/api/auth/signup',{method:'POST',body:{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,name:document.getElementById('fullName').value.trim()}});show(d.message||'Account request submitted. Check your email for a confirmation link if email confirmation is enabled.','ok')}catch(e){show(e.message,'error')}finally{btn.disabled=false}};
function show(text,type){const el=document.getElementById('msg');if(el){el.className='account-message '+type;el.textContent=text}}
 document.getElementById('loginBtn').onclick=login;document.getElementById('signupBtn').onclick=signup;document.getElementById('authForm').addEventListener('submit',e=>{e.preventDefault();login()});}
async function view(){try{const d=await api('/api/auth/me');if(!d.user){renderAuth();return}const u=d.user;A.innerHTML=`<section class="account-card"><div class="eyebrow">MY ACCOUNT</div><h1 class="h2">Welcome back</h1><p>${esc(u.email)}</p><div class="account-actions"><button class="btn outline" id="logout">Sign out</button><a class="btn primary" href="/">Continue shopping</a></div></section><section class="account-card"><h2>My orders</h2><div id="orders" class="account-small">Loading your orders…</div></section>`;document.getElementById('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{renderAuth('You have been signed out.','ok')}};try{const o=await api('/api/orders/my');document.getElementById('orders').innerHTML=(o.orders||[]).length?o.orders.map(x=>`<div class="orderline"><b>${esc(x.order_number||'Order')}</b> — ₹${esc(x.total)}<br><span class="account-small">${esc(x.order_status||x.status||'new')} · ${esc(x.payment_status||'pending')} · ${esc(new Date(x.created_at).toLocaleString('en-IN'))}</span></div>`).join(''):'No orders found for this account yet.'}catch(e){document.getElementById('orders').textContent='Could not load orders: '+e.message}}catch(e){renderAuth('Could not contact the login service. Refresh the page; if this continues, the deployment or Supabase environment variables need checking. '+e.message,'error')}}view();})();
</script></body></html>
